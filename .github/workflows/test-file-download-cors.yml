name: Test CurseForge file metadata CORS
on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/test-file-download-cors.yml'
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Check CFWidget exact file metadata and CORS
        run: |
          set -x
          curl -sS -D /tmp/headers.txt --max-time 30 \
            -H 'Origin: https://curseforge-profile-merger.github.io' \
            -H 'User-Agent: Mozilla/5.0' \
            'https://api.cfwidget.com/448233?version=6780251' \
            -o /tmp/body.json || true
          cat /tmp/headers.txt || true
          python - <<'PY'
          import json
          try:
              data=json.load(open('/tmp/body.json'))
              print(json.dumps({'id': data.get('id'), 'name': data.get('name'), 'download': data.get('download')}, indent=2)[:8000])
          except Exception as e:
              print('parse error', e)
              print(open('/tmp/body.json').read()[:8000])
          PY
