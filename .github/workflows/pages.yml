name: Deploy static site to Pages

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Check CurseForge share CORS
        continue-on-error: true
        shell: bash
        run: |
          curl -sS -L --range 0-0 --max-time 30 \
            -H 'Origin: https://curseforge-profile-merger.github.io' \
            -D /tmp/cf-headers.txt -o /dev/null \
            'https://api.curseforge.com/v1/shared-profile/ffy4iC_2' || true
          echo '--- CurseForge/forgecdn response headers relevant to browser fetch ---'
          grep -iE '^(HTTP/|location:|access-control-allow-origin:|access-control-allow-credentials:|content-type:)' /tmp/cf-headers.txt || true

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: .

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
