name: Deploy static site to Pages

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Check CurseForge share CORS headers
        continue-on-error: true
        shell: bash
        run: |
          curl -sS -L --range 0-0 --max-time 30 \
            -H 'Origin: https://curseforge-profile-merger.github.io' \
            -D /tmp/cf-headers.txt -o /dev/null \
            'https://api.curseforge.com/v1/shared-profile/ffy4iC_2' || true
          echo '--- CurseForge/forgecdn response headers relevant to browser fetch ---'
          grep -iE '^(HTTP/|location:|access-control-allow-origin:|access-control-allow-credentials:|content-type:)' /tmp/cf-headers.txt || true

      - name: Check CurseForge share fetch in Chrome
        continue-on-error: true
        shell: bash
        run: |
          BROWSER="$(command -v google-chrome || command -v chromium || command -v chromium-browser || true)"
          if [ -z "$BROWSER" ]; then
            echo 'No Chrome/Chromium found on runner'
            exit 0
          fi
          mkdir -p /tmp/cf-browser-test
          cat >/tmp/cf-browser-test/index.html <<'HTML'
          <!doctype html><meta charset="utf-8"><div id="result">PENDING</div><script>
          fetch('https://api.curseforge.com/v1/shared-profile/ffy4iC_2', {redirect:'follow', credentials:'omit'})
            .then(async r => { const b = await r.arrayBuffer(); document.getElementById('result').textContent = `SUCCESS status=${r.status} bytes=${b.byteLength} url=${r.url}`; })
            .catch(e => { document.getElementById('result').textContent = `ERROR ${e.name}: ${e.message}`; });
          </script>
          HTML
          cd /tmp/cf-browser-test
          python3 -m http.server 8765 >/tmp/cf-http.log 2>&1 &
          SERVER_PID=$!
          trap 'kill $SERVER_PID 2>/dev/null || true' EXIT
          sleep 1
          "$BROWSER" --headless --no-sandbox --disable-gpu --virtual-time-budget=10000 --dump-dom http://127.0.0.1:8765/ 2>/tmp/cf-chrome.err | grep -E 'SUCCESS|ERROR|PENDING' || true
          echo '--- Chrome stderr tail ---'
          tail -30 /tmp/cf-chrome.err || true

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: .

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
